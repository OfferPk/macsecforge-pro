<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="600" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">IEEE 802.1AE MACsec &amp; 802.1X MKA Wire-Speed Architecture</text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Hardware ASIC Line-Rate Encryption &amp; Extended Packet Numbering (XPN) Framework</text>

  <!-- Router A -->
  <rect x="60" y="100" width="220" height="130" rx="10" fill="url(#routerGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="170" y="130" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Data Center Edge A</text>
  <text x="170" y="150" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">IAD-DCI-SPINE-01</text>
  <text x="170" y="175" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">FourHundredGigE0/0/0/0</text>
  <text x="170" y="200" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">400G Line Card PHY/ASIC</text>

  <!-- Optical Line -->
  <line x1="280" y1="165" x2="820" y2="165" stroke="#10b981" stroke-width="4" stroke-dasharray="8 4"/>
  <rect x="430" y="145" width="240" height="40" rx="6" fill="#080e1d" stroke="#10b981" stroke-width="1"/>
  <text x="550" y="170" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">400 Gbps Dark Fiber Link</text>

  <!-- Router B -->
  <rect x="820" y="100" width="220" height="130" rx="10" fill="url(#routerGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="930" y="130" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Data Center Edge B</text>
  <text x="930" y="150" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">ORD-DCI-SPINE-02</text>
  <text x="930" y="175" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">FourHundredGigE0/0/0/0</text>
  <text x="930" y="200" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">400G Line Card PHY/ASIC</text>

  <!-- MKA Protocol Arrow -->
  <path d="M 280 120 C 550 70 550 70 820 120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="550" y="90" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">IEEE 802.1X MKA Key Agreement (EAPOL-MKA / SAK Derivation)</text>

  <!-- Encapsulation Breakdown Box -->
  <rect x="60" y="260" width="980" height="300" rx="10" fill="#0b1329" stroke="#1d2847" stroke-width="1.5"/>
  <text x="90" y="295" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">IEEE 802.1AE Encapsulated Frame Architecture (SecTAG &amp; ICV)</text>

  <!-- Frame Blocks -->
  <!-- DMAC & SMAC -->
  <rect x="90" y="320" width="130" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="155" y="345" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">DMAC / SMAC</text>
  <text x="155" y="362" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">12 Bytes (Plain)</text>

  <!-- 802.1Q (Optional) -->
  <rect x="225" y="320" width="105" height="55" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
  <text x="277" y="345" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">[802.1Q]*</text>
  <text x="277" y="362" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10">Offset 30 (4B)</text>

  <!-- SecTAG -->
  <rect x="335" y="320" width="220" height="55" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="445" y="345" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">SecTAG (16 Bytes)</text>
  <text x="445" y="362" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="10">0x88E5 | TCI/AN | SL | PN | SCI</text>

  <!-- Encrypted Payload -->
  <rect x="560" y="320" width="280" height="55" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="700" y="345" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Encrypted User Payload</text>
  <text x="700" y="362" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10">GCM-AES-XPN-256 Confidentiality</text>

  <!-- ICV -->
  <rect x="845" y="320" width="115" height="55" rx="4" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="902" y="345" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">ICV (16B)</text>
  <text x="902" y="362" text-anchor="middle" fill="#ddd6fe" font-family="monospace" font-size="10">AES-GCM Tag</text>

  <!-- FCS -->
  <rect x="965" y="320" width="55" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="992" y="345" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">FCS</text>
  <text x="992" y="362" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">4B</text>

  <!-- Legend Brackets -->
  <line x1="335" y1="390" x2="960" y2="390" stroke="#06b6d4" stroke-width="2"/>
  <text x="647" y="410" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Authenticated Data Scope (SecTAG + User Data + ICV Check)</text>

  <line x1="560" y1="425" x2="840" y2="425" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="445" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Ciphertext Scope (Payload Encryption)</text>

  <!-- Technical Explanations Bottom -->
  <rect x="90" y="470" width="440" height="70" rx="6" fill="#070c1a" stroke="#1d2847" stroke-width="1"/>
  <text x="105" y="492" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Why Extended Packet Numbering (XPN) Matters:</text>
  <text x="105" y="510" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">On 400G links, 32-bit PN rolls over in 7.2s under small frames.</text>
  <text x="105" y="528" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">64-bit XPN extends SAK lifetime to &gt;900 years, eliminating flap risks.</text>

  <rect x="550" y="470" width="470" height="70" rx="6" fill="#070c1a" stroke="#1d2847" stroke-width="1"/>
  <text x="565" y="492" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Strict Fail-Closed Enforcement:</text>
  <text x="565" y="510" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">If MKA drops, interface enforces 'must-secure' to drop all frames.</text>
  <text x="565" y="528" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Prevents cleartext traffic leakage into transit optical fibers.</text>
</svg>
